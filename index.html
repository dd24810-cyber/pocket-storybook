<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Safeguard against "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // Defines both getter and setter for window.fetch so scripts or container harnesses can wrap it safely
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : originalFetch;
            }
          });
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
